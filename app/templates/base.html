<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BBMetrics{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/heroicons/2.1.1/24/outline/style.min.css"
          crossorigin="anonymous"/>
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        body { background-color: #0f172a; }
        .nav-link { @apply text-slate-300 hover:text-white hover:bg-slate-700 px-3 py-2 rounded-md text-sm font-medium transition-colors; }
        .nav-link.active { @apply text-white bg-brand-600; }
        .card { @apply bg-slate-800 border border-slate-700 rounded-xl shadow-lg; }
        .btn-primary { @apply bg-brand-600 hover:bg-brand-700 text-white font-semibold px-4 py-2 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed; }
        .btn-secondary { @apply bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium px-4 py-2 rounded-lg transition-colors; }
        .input-field { @apply bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent placeholder-slate-500; }
        .badge-done    { @apply bg-emerald-900 text-emerald-300 text-xs font-semibold px-2 py-0.5 rounded-full; }
        .badge-running { @apply bg-yellow-900 text-yellow-300 text-xs font-semibold px-2 py-0.5 rounded-full animate-pulse; }
        .badge-pending { @apply bg-slate-700 text-slate-400 text-xs font-semibold px-2 py-0.5 rounded-full; }
        .badge-error   { @apply bg-red-900 text-red-300 text-xs font-semibold px-2 py-0.5 rounded-full; }
        .table-header  { @apply text-left text-xs font-semibold text-slate-400 uppercase tracking-wider px-4 py-3; }
        .table-cell    { @apply px-4 py-3 text-sm text-slate-300 whitespace-nowrap; }
        .table-row     { @apply border-b border-slate-700 hover:bg-slate-750 transition-colors; }
        input, textarea, select {
            color: #e0e6ed !important;
            background: #171e2e !important;
            border-color: #394867 !important;
            border-radius: 6px !important;
            padding: 6px 10px !important;
            font-size: 15px !important;
            height: 34px !important;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #4682fa !important;
            outline: none !important;
        }
        ::placeholder,
        input::placeholder,
        textarea::placeholder {
            color: #7c8ba7 !important;
            opacity: 1 !important;
        }
        .form-group, .form-row, .form-section {
            margin-bottom: 12px !important;
        }
        input.py-2, select.py-2, textarea.py-2 {
            padding-top: 6px !important;
            padding-bottom: 6px !important;
            height: 34px !important;
        }
        .input-field::placeholder {
            color: #7c8ba7 !important;
        }
        .dataTables_wrapper .dataTables_paginate .paginate_button {
            color: #e0e6ed !important;
            background: #1e293b !important;
            border: 1px solid #394867 !important;
            border-radius: 5px !important;
            margin: 2px;
        }
        table.dataTable tr { background-color: #1e293b !important; color: #e0e6ed !important;}
        table.dataTable thead { background-color: #0f172a !important;}
        table.dataTable td { color: #e0e6ed !important;}
        table.dataTable th { color: #60a5fa !important;}
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="text-slate-100 min-h-screen">

<nav class="bg-slate-900 border-b border-slate-700 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <div class="flex items-center gap-8">
                <a href="/" class="flex items-center gap-2">
                    <svg class="w-7 h-7 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    <span class="text-xl font-bold text-white tracking-tight">BBMetrics</span>
                </a>
                <div class="hidden md:flex items-center gap-1">
                    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
                    <a href="/scan" class="nav-link {% if request.url.path == '/scan' %}active{% endif %}">New Scan</a>
                </div>
            </div>
            <!-- Ícone do GitHub REMOVIDO -->
        </div>
    </div>
</nav>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
</main>

<footer class="border-t border-slate-800 mt-16 py-6 text-center text-slate-500 text-sm">
    BBMetrics Web &mdash; Powered by FastAPI &amp; Azure
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
