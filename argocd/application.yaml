apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bbmetrics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ralphtacconi/bbmetrics-web
    targetRevision: feature/aks-argocd
    path: k8s/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: bbmetrics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
