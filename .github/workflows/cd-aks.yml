name: CD AKS GitOps

on:
  push:
    branches: [feature/aks-argocd]

permissions:
  id-token: write
  contents: write

jobs:
  build-push-and-update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Login ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}
      - name: Build and push image
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          IMAGE_TAG="sha-${SHORT_SHA}"
          docker build -t ${ACR_LOGIN_SERVER}/bbmetrics:${IMAGE_TAG} .
          docker push ${ACR_LOGIN_SERVER}/bbmetrics:${IMAGE_TAG}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
      - name: Install kustomize
        run: |
          curl -sL https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_linux_amd64.tar.gz | tar xz
          sudo mv kustomize /usr/local/bin/kustomize
      - name: Update kustomize image tag
        env:
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
        run: |
          cd k8s/overlays/production
          kustomize edit set image YOUR_ACR.azurecr.io/bbmetrics=${ACR_LOGIN_SERVER}/bbmetrics:${IMAGE_TAG}
      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/production/kustomization.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update image tag to ${IMAGE_TAG} [skip ci]"
          git push
