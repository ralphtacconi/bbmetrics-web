name: Pipeline - Container Apps

on:
  push:
    branches:
      - bbmetrics-container

env:
  ACR_NAME: acrbbmetricsdev
  IMAGE: bbmetrics-web
  RESOURCE_GROUP: rg-bbmetrics

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set_tag.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG var (git short SHA)
        id: set_tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List workspace files
        run: ls -lah

      - name: List context files
        run: ls -lah app

      - name: Build Docker image
        run: docker build -t $ACR_NAME.azurecr.io/$IMAGE:${{ steps.set_tag.outputs.IMAGE_TAG }} .

      - name: Inspect built Docker image
        run: |
          docker run --rm acrbbmetricsdev.azurecr.io/bbmetrics-web:${{ steps.set_tag.outputs.IMAGE_TAG }} ls -lah /app/app

      - name: Azure ACR login (with token)
        run: |
          TOKEN=$(az acr login --name $ACR_NAME --expose-token --query accessToken -o tsv)
          echo $TOKEN | docker login $ACR_NAME.azurecr.io -u 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Push image to ACR
        run: docker push $ACR_NAME.azurecr.io/$IMAGE:${{ steps.set_tag.outputs.IMAGE_TAG }}

  cd:
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: ./infra/container-apps
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false -no-color -reconfigure

      - name: Show Terraform Vars
        run: cat terraform.tfvars || true

      - name: Terraform Apply
        env:
          IMAGE_TAG: ${{ needs.ci.outputs.image_tag }}
        run: |
          terraform apply -auto-approve -input=false -no-color \
            -var="image_tag=$IMAGE_TAG"