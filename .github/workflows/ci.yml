name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q app BBMetrics_UI bbmetrics_dc/*.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Smoke test CLI
        run: python -m bbmetrics_dc.cli --help
      - name: Smoke test FastAPI routes
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          assert c.get('/health').status_code == 200
          assert c.get('/').status_code == 200
          assert c.get('/scan').status_code == 200
          print('smoke-ok')
          PY
