name: CD - Deploy Terraform infra

on:
  workflow_run:
    workflows: ["CI - Build and Push Docker image"]
    types:
      - completed
  workflow_dispatch:

env:
  RESOURCE_GROUP: rg-bbmetrics

jobs:
  terraform-deploy:
    runs-on: ubuntu-latest
    # ✅ Só executa se o CI terminou com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: ./infra/container-apps

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          # ✅ Usa a branch que disparou o CI (ex: bbmetrics-container)
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve